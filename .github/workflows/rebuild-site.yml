name: Rebuild site

on:
  push:
    paths:
      - 'data/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild static site
        run: python build_site.py
      - name: Commit and push rebuilt site
        run: |
          git config user.name "social-bot"
          git config user.email "social-bot@users.noreply.github.com"
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "rebuild site from latest feed data"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
          else
            echo "No site changes needed"
          fi